<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>商业地产 · 争议案件处理台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d3d6b'/%3E%3Cpath d='M9 23V9h6a4 4 0 0 1 0 8h-3v6z' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/static/vendor/tabler/css/tabler.min.css" />
  <link rel="stylesheet" href="/static/css/workbench.css" />
</head>
<body class="wb-body">
  <header class="wb-topbar">
    <div class="wb-topbar-inner">
      <button type="button" class="wb-icon-btn wb-sidebar-toggle" id="sidebar-toggle"
              aria-controls="case-sidebar" aria-expanded="true" title="收起 / 展开案件列表">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
        <span class="visually-hidden">案件列表</span>
      </button>
      <div class="wb-brand">
        <a class="wb-brand-name" href="/" title="返回运营总览">争议案件处理台</a>
      </div>
      <div class="wb-topbar-right">
        <a class="wb-btn wb-btn-ghost" href="/static/mall/index.html">3D 商场</a>
        <span class="wb-mode" id="mode-badge">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M12 8v5M12 16h.01" /></svg>
          <span><span id="mode-label">读取运行模式…</span><span class="wb-mode-detail"> · 合成数据</span></span>
        </span>
        <span class="wb-role" id="role-label">角色加载中…</span>
        <button type="button" class="wb-btn wb-btn-primary wb-new-top" id="new-run-btn-top">新建调查</button>
        <button type="button" class="wb-btn wb-btn-ghost" id="refresh-btn">刷新</button>
      </div>
    </div>
  </header>

  <div class="wb-shell" id="wb-shell">
    <aside class="wb-sidebar" id="case-sidebar" aria-label="案件列表">
      <div class="wb-sidebar-head">
        <h2 class="wb-sidebar-title">案件</h2>
        <span class="wb-muted" id="runs-count">—</span>
      </div>
      <button type="button" class="wb-btn wb-btn-primary wb-btn-block" id="new-run-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        新建调查
      </button>
      <div class="wb-sidebar-filters">
        <label class="visually-hidden" for="run-search">搜索案件</label>
        <input type="search" class="wb-input" id="run-search" placeholder="搜索案件" autocomplete="off" />
        <label class="visually-hidden" for="run-filter">按状态筛选</label>
        <select class="wb-input" id="run-filter" title="按状态筛选">
          <option value="all">全部状态</option>
          <option value="awaiting_approval">待审批</option>
          <option value="completed">已结束</option>
          <option value="failed">失败</option>
        </select>
      </div>
      <div class="wb-case-list" id="runs-list" role="list"></div>
      <div class="wb-empty d-none" id="runs-empty">
        <div class="wb-empty-title">没有匹配的案件</div>
        <div class="wb-muted">调整筛选条件，或新建一次调查。</div>
      </div>
      <div class="wb-muted d-none" id="runs-loading">正在读取案件列表…</div>
      <p class="wb-sidebar-foot wb-muted">可搜索最近 50 个案件</p>
    </aside>

    <main class="wb-main" id="wb-main">
      <div class="wb-alert d-none" id="page-alert" role="alert"></div>

      <section class="wb-case-head" aria-labelledby="header-title">
        <div class="wb-case-heading">
          <div class="min-w-0">
            <div class="wb-case-kicker" id="header-pretitle"></div>
            <div class="wb-case-title-row">
              <h1 class="wb-case-title" id="header-title" tabindex="-1">选择案件或新建调查</h1>
              <span class="wb-status d-none" id="run-status-badge"></span>
            </div>
          </div>
          <button type="button" class="wb-btn wb-btn-primary d-none" id="case-action"></button>
        </div>
        <div class="wb-case-question" id="header-question"></div>
      </section>

      <section class="wb-overview d-none" id="case-overview" aria-label="调查结论"></section>

      <section class="wb-panel d-none" id="report-card" aria-label="案件详情">
        <div class="wb-tabs" role="tablist" aria-label="案件详情页签">
          <button type="button" class="wb-tab is-active" role="tab" id="tab-summary" aria-controls="pane-summary" aria-selected="true">调查结果</button>
          <button type="button" class="wb-tab" role="tab" id="tab-conflicts" aria-controls="pane-conflicts" aria-selected="false">冲突对照</button>
          <button type="button" class="wb-tab" role="tab" id="tab-evidence" aria-controls="pane-evidence" aria-selected="false">证据</button>
          <button type="button" class="wb-tab" role="tab" id="tab-approval" aria-controls="pane-approval" aria-selected="false">审批单</button>
          <button type="button" class="wb-tab" role="tab" id="tab-tech" aria-controls="pane-tech" aria-selected="false">调查过程</button>
        </div>
        <div class="wb-tab-panes">
          <div class="wb-pane" id="pane-summary" role="tabpanel" aria-labelledby="tab-summary"></div>
          <div class="wb-pane d-none" id="pane-conflicts" role="tabpanel" aria-labelledby="tab-conflicts"></div>
          <div class="wb-pane d-none" id="pane-evidence" role="tabpanel" aria-labelledby="tab-evidence"></div>
          <div class="wb-pane d-none" id="pane-approval" role="tabpanel" aria-labelledby="tab-approval"></div>
          <div class="wb-pane d-none" id="pane-tech" role="tabpanel" aria-labelledby="tab-tech">
            <section class="wb-collab" id="collab-card" aria-label="协作视图">
              <div class="wb-canvas" id="graph-canvas">
                <svg class="wb-links" id="graph-links" aria-hidden="true" focusable="false"></svg>

                <button type="button" class="wb-node wb-node-plan" data-node="plan" aria-pressed="false">
                  <span class="wb-node-head">
                    <span class="wb-node-title">任务规划</span>
                    <span class="wb-status" data-status="idle">等待运行</span>
                  </span>
                  <span class="wb-node-finding" data-role="finding">按问题涉及的事项分派调查</span>
                </button>

                <button type="button" class="wb-node wb-node-agent" data-node="agent:lease" data-domain="lease" aria-pressed="false" title="合同查询（lease.query）">
                  <span class="wb-node-head">
                    <span class="wb-node-title">合同</span>
                    <span class="wb-status" data-status="idle">等待运行</span>
                  </span>
                  <span class="wb-node-finding" data-role="finding">租期、条款与合同版本</span>
                </button>

                <button type="button" class="wb-node wb-node-agent" data-node="agent:billing" data-domain="billing" aria-pressed="false" title="账单核对（billing.statement）">
                  <span class="wb-node-head">
                    <span class="wb-node-title">账单</span>
                    <span class="wb-status" data-status="idle">等待运行</span>
                  </span>
                  <span class="wb-node-finding" data-role="finding">应收、已收、欠费与差异</span>
                </button>

                <button type="button" class="wb-node wb-node-agent" data-node="agent:property" data-domain="property" aria-pressed="false" title="工单查询（property.work_orders）">
                  <span class="wb-node-head">
                    <span class="wb-node-title">物业</span>
                    <span class="wb-status" data-status="idle">等待运行</span>
                  </span>
                  <span class="wb-node-finding" data-role="finding">报修记录与未关闭工单</span>
                </button>

                <div class="wb-merge" id="merge-caption"><span class="visually-hidden">各领域结果合并后进入证据核验</span></div>

                <button type="button" class="wb-node wb-node-sink" data-node="verify" aria-pressed="false">
                  <span class="wb-node-head">
                    <span class="wb-node-title">证据核验</span>
                    <span class="wb-status" data-status="idle">等待运行</span>
                  </span>
                  <span class="wb-node-finding" data-role="finding">核对冲突、资料缺口与结论</span>
                </button>

                <button type="button" class="wb-node wb-node-sink" data-node="report" aria-pressed="false">
                  <span class="wb-node-head">
                    <span class="wb-node-title">调查报告</span>
                    <span class="wb-status" data-status="idle">等待运行</span>
                  </span>
                  <span class="wb-node-finding" data-role="finding">汇总事实、冲突与缺失</span>
                </button>

                <button type="button" class="wb-node wb-node-sink" data-node="approval" aria-pressed="false">
                  <span class="wb-node-head">
                    <span class="wb-node-title">人工审批</span>
                    <span class="wb-status" data-status="idle">等待运行</span>
                  </span>
                  <span class="wb-node-finding" data-role="finding">物业 → 财务 两级审批草案</span>
                </button>
              </div>
              <p class="wb-muted wb-graph-note" id="graph-note">
                点击节点查看本次调查记录。
              </p>
              <div class="wb-node-detail d-none" id="node-detail">
                <div class="wb-node-detail-head">
                  <div>
                    <div class="wb-muted" id="node-detail-kicker">节点详情</div>
                    <h3 class="wb-node-detail-title" id="node-detail-title">—</h3>
                    <div class="wb-muted" id="node-detail-sub"></div>
                  </div>
                  <button type="button" class="wb-btn wb-btn-ghost" id="node-detail-close">关闭</button>
                </div>
                <div id="node-detail-body"></div>
              </div>
            </section>
            <details class="wb-details">
              <summary>案件流程进度</summary>
              <ol class="wb-steps" id="progress-steps" aria-label="案件流程进度"></ol>
            </details>
            <details class="wb-tech" id="tech-details">
              <summary>技术视图 · 工具调用与原始数据</summary>
              <div class="wb-tech-body">
                <h3 class="wb-section-title">工具调用记录</h3>
                <div id="pane-calls"></div>
                <h3 class="wb-section-title">原始数据</h3>
                <div id="pane-raw"></div>
              </div>
            </details>
          </div>
        </div>
      </section>

    </main>
  </div>

  <dialog class="wb-drawer" id="new-run-drawer" aria-labelledby="new-run-title">
    <form class="wb-drawer-inner" id="run-form" novalidate>
      <div class="wb-drawer-head">
        <h2 class="wb-panel-title" id="new-run-title">新建调查</h2>
        <button type="button" class="wb-btn wb-btn-ghost" id="drawer-close">关闭</button>
      </div>
      <div class="wb-drawer-body">
        <label class="wb-label" for="question">调查问题</label>
        <textarea class="wb-input" id="question" name="question" rows="5" maxlength="2000"
                  required>商铺 A-301 投诉最近三个月租金金额不一致，同时声称空调多次维修未解决，并要求减免费用。请核对合同、账单、付款和工单。</textarea>

        <label class="wb-label" for="lease-id">租约编号</label>
        <input type="text" class="wb-input" id="lease-id" name="lease_id"
               value="lease_xh_a301_2025" maxlength="64" autocomplete="off" required />
        <div class="wb-hint">合成数据中的租约：A-301（云端咖啡）、A-302（星汇文具）。</div>

        <label class="wb-check">
          <input type="checkbox" id="with-approval" checked />
          <span>启用人工审批（发现差额时暂停，等待物业与财务审批）</span>
        </label>

        <div class="wb-label">示例问题</div>
        <div class="wb-examples">
          <button type="button" class="wb-btn wb-btn-ghost wb-example"
                  data-question="商铺 A-301 投诉最近三个月租金金额不一致，同时声称空调多次维修未解决，并要求减免费用。请核对合同、账单、付款和工单。">跨系统争议</button>
          <button type="button" class="wb-btn wb-btn-ghost wb-example"
                  data-question="A-301 现在还有多少钱没交？">单一账单查询</button>
          <button type="button" class="wb-btn wb-btn-ghost wb-example"
                  data-question="A-301 的租期是什么时候？">合同条款查询</button>
        </div>
        <div class="wb-alert wb-alert-danger d-none" id="form-alert" role="alert"></div>
      </div>
      <div class="wb-drawer-foot">
        <button type="submit" class="wb-btn wb-btn-primary" id="submit-btn">
          <span class="wb-spinner d-none" id="submit-spinner" aria-hidden="true"></span>
          <span id="submit-label">提交调查</span>
        </button>
        <span class="wb-muted" id="form-status" role="status" aria-live="polite"></span>
      </div>
    </form>
  </dialog>

  <noscript>
    <div class="wb-alert wb-alert-warning">本页面需要 JavaScript 才能调用后端接口。</div>
  </noscript>

  <script src="/static/vendor/tabler/js/tabler.min.js" defer></script>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
