# Billing Agent 配置
# 与 lease.yaml 完全独立：改本文件不会影响 Lease Agent。

name: billing
version: 1.1.0
enabled: true
description: 物业账单查询、费用构成说明与欠费核对

capabilities:
  - billing.statement
  - billing.arrears_check

model_provider: deepseek
# 2026-11-21 核对官方 API 文档：`deepseek-chat` 已于 2026-07-24 15:59 UTC 下线，
# 当前模型名 `deepseek-flash`（DeepSeek-V4.1-Flash-1017）。
model_name: deepseek-flash
temperature: null
max_tokens: 1024
api_key_env: DEEPSEEK_API_KEY

timeout_seconds: 20
max_retries: 1
prompt_path: app/agents/billing/prompts/system.md

allowed_tools:
  - billing.statement.read
  - billing.arrears.calculate

retrieval_settings:
  enabled: false

log_level: WARNING
