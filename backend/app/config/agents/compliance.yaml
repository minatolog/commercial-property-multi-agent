# Compliance Agent 配置
# 示例：默认禁用。禁用后该能力会从可用能力清单中消失，
# 调用方必须显式处理 AgentDisabledError，不允许静默忽略。
# 业务逻辑**未实现**（调用只会返回 NOT_IMPLEMENTED）；本文件只描述真实状态。

name: compliance
version: 0.1.0
enabled: false
description: 合同合规检查与租约风险提示（默认禁用，业务逻辑未实现）

capabilities:
  - compliance.check

model_provider: deepseek
# 2026-11-21 核对官方 API 文档：`deepseek-chat` 已于 2026-07-24 15:59 UTC 下线，
# 当前模型名 `deepseek-flash`（DeepSeek-V4.1-Flash-1017）。
model_name: deepseek-flash
temperature: 0.0
max_tokens: 2048
api_key_env: DEEPSEEK_API_KEY

timeout_seconds: 45
max_retries: 1
prompt_path: app/agents/compliance/prompts/system.md

allowed_tools:
  - compliance.checklist.read
  - lease.term_extract

# Compliance Agent 未实现，检索也未接入：不得声明任何未实现的检索能力
# （vector_store/embedding_model/rerank 等字段已被 Schema 移除，写了会校验失败）。
retrieval_settings:
  enabled: false
  top_k: 8

log_level: INFO
