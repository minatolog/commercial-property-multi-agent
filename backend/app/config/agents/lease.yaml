# Lease Agent 配置
# 命名规范：<domain>.<action>
# 密钥只允许通过环境变量提供，禁止在本文件写入 api_key 等敏感字段（会被 Schema 拒绝）。

name: lease
version: 1.0.0
enabled: true
description: 租约条款查询、租金结构解读与续租评估

capabilities:
  - lease.query
  - lease.renewal_evaluation

model_provider: deepseek
# 2026-11-21 核对官方 API 文档：`deepseek-chat` 已于 2026-07-24 15:59 UTC 正式下线，
# 当前模型名为 `deepseek-flash`（服务 DeepSeek-V4.1-Flash-1017）。
# 依据：https://api-docs.deepseek.com/news/news260424 、https://api-docs.deepseek.com/quick_start/pricing
model_name: deepseek-flash
temperature: 0.1
max_tokens: 2048
api_key_env: DEEPSEEK_API_KEY

timeout_seconds: 30
max_retries: 2
prompt_path: app/agents/lease/prompts/system.md

allowed_tools:
  - lease.lookup
  - lease.term_extract
  - billing.statement.read
  - document.search

# 检索实现只有 BM25（app/rag/bm25.py）；vector_store/embedding_model/rerank 等未实现，
# 不得写进运行配置（写了会在加载期被 Schema 拒绝）。
retrieval_settings:
  enabled: true
  top_k: 6

log_level: INFO
