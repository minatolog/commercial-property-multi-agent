# Lease Agent 配置
# 命名规范：<domain>.<action>
# 密钥只允许通过环境变量提供，禁止在本文件写入 api_key 等敏感字段（会被 Schema 拒绝）。

name: lease
version: 1.0.0
enabled: true
description: 租约条款查询、租金结构解读与续租评估

capabilities:
  - lease.query
  - lease.renewal_evaluation

model_provider: deepseek
model_name: deepseek-chat
temperature: 0.1
max_tokens: 2048
api_key_env: DEEPSEEK_API_KEY

timeout_seconds: 30
max_retries: 2
prompt_path: app/agents/lease/prompts/system.md

allowed_tools:
  - lease.lookup
  - lease.term_extract
  - billing.statement.read

retrieval_settings:
  enabled: true
  top_k: 6
  rerank_top_n: 3
  vector_store: chroma
  embedding_model: BAAI/bge-base-zh-v1.5
  bm25_weight: 0.4
  vector_weight: 0.6
  min_score: 0.2

log_level: INFO
