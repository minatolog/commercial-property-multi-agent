[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commercial-property-multi-agent"
version = "0.1.0"
description = "Agent-first 商业地产多 Agent 工作流：Runtime、受控只读工具、LangChain 模型适配与合同条款 RAG"
readme = "README.md"
requires-python = ">=3.11"
# 只声明当前源码真实使用的依赖；不引入 LangGraph / 数据库 / 向量库 / Web 框架
dependencies = [
    "pydantic>=2.6,<3",
    "PyYAML>=6.0,<7",
    # Task 008：LangChain 模型适配层（DeepSeek 走 OpenAI 兼容端点）
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    # Task 009：多 Agent 图编排
    "langgraph>=1.0,<2",
    # Task 010：只读业务数据层与迁移（本机验证用 SQLite；生产目标 PostgreSQL）
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.13,<2",
    # Task 011：PDF 解析与中文 PDF 生成（合成合同样本）
    "pypdf>=5.0,<7",
    "reportlab>=4.0,<5",
]

[project.optional-dependencies]
# pytest 仅作为开发期可选依赖声明；本轮环境未安装、也不允许安装
dev = ["pytest>=8.0,<9"]

[project.scripts]
commercial-agent = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"
