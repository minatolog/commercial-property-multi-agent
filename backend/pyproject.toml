[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commercial-property-multi-agent"
version = "0.1.0"
description = "Agent-first 商业地产多 Agent 工作流：Task 007 的离线 Runtime 与受控只读工具"
readme = "README.md"
requires-python = ">=3.11"
# 只声明当前源码真实使用的依赖；不引入 LangChain / LangGraph / 数据库 / 向量库 / Web / 模型 SDK
dependencies = [
    "pydantic>=2.6,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
# pytest 仅作为开发期可选依赖声明；本轮环境未安装、也不允许安装
dev = ["pytest>=8.0,<9"]

[project.scripts]
commercial-agent = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"
